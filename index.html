<!doctype html>
<html lang="ru" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23171717'/%3E%3Ctext x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' font-family='ui-monospace,monospace' font-size='16' font-weight='600' fill='white'%3EH%3C/text%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Life Hub" />
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23171717'/%3E%3Ctext x='50' y='66' text-anchor='middle' font-size='52' font-weight='600' fill='white' font-family='ui-monospace,monospace'%3EH%3C/text%3E%3C/svg%3E" />

    <meta name="description" content="Life Hub — личный дашборд: задачи, привычки, таблетки. PWA с темами и offline-режимом." />

    <title>Life Hub — задачи, привычки, таблетки</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Unbounded:wght@600;700;800&display=swap" rel="stylesheet" />

    <script>
      // Apply saved theme (incl. custom palette) before paint to avoid flash
      (function () {
        try {
          var html = document.documentElement;
          var saved = localStorage.getItem('hub-theme');
          var themes = ['light', 'dark', 'midnight', 'forest', 'crimson', 'custom'];
          var theme = (saved && themes.indexOf(saved) !== -1)
            ? saved
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          html.setAttribute('data-theme', theme);

          if (theme === 'custom') {
            var raw = localStorage.getItem('hub-theme-custom');
            var p = { mode: 'dark', accent: '#7c5cff', accent2: '#ff5cc8' };
            if (raw) { try { p = Object.assign(p, JSON.parse(raw)); } catch (e) {} }
            var bg = p.mode === 'light' ? '#ffffff' : '#0a0a0a';
            var L = {
              '--bg':'#ffffff','--bg-elev':'#ffffff','--bg-subtle':'#fafafa',
              '--text':'#171717','--text-secondary':'#4d4d4d','--text-muted':'#808080',
              '--border':'rgba(0,0,0,0.08)','--border-strong':'#ebebeb','--inner-glow':'#fafafa',
              '--shadow-card':'rgba(0,0,0,0.08) 0 0 0 1px, rgba(0,0,0,0.04) 0 2px 2px, rgba(0,0,0,0.04) 0 8px 8px -8px, var(--inner-glow) 0 0 0 1px inset',
              '--shadow-ring':'rgba(0,0,0,0.08) 0 0 0 1px','--grid-color':'rgba(0,0,0,0.04)',
              '--accent-green':'#17a25b','--accent-amber':'#d97706','--accent-red':'#ff5b4f'
            };
            var D = {
              '--bg':'#0a0a0a','--bg-elev':'#111111','--bg-subtle':'#161616',
              '--text':'#ededed','--text-secondary':'#a1a1a1','--text-muted':'#6e6e6e',
              '--border':'rgba(255,255,255,0.10)','--border-strong':'#262626','--inner-glow':'#1a1a1a',
              '--shadow-card':'rgba(255,255,255,0.08) 0 0 0 1px, rgba(0,0,0,0.4) 0 2px 4px, rgba(0,0,0,0.6) 0 8px 24px -8px, var(--inner-glow) 0 0 0 1px inset',
              '--shadow-ring':'rgba(255,255,255,0.10) 0 0 0 1px','--grid-color':'rgba(255,255,255,0.04)',
              '--accent-green':'#4ade80','--accent-amber':'#fbbf24','--accent-red':'#ff7a70'
            };
            var base = p.mode === 'light' ? L : D;
            for (var k in base) html.style.setProperty(k, base[k]);
            html.style.setProperty('--accent-blue', p.accent);
            html.style.setProperty('--link', p.accent);
            html.style.setProperty('--focus', p.accent);
            html.style.setProperty('--accent-pink', p.accent2);
            html.style.setProperty('--badge-bg', 'color-mix(in srgb, ' + p.accent + ' ' + (p.mode === 'light' ? 14 : 22) + '%, ' + bg + ')');
            html.style.setProperty('--badge-text', p.accent);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
